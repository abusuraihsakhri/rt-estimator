name: Tests and security checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install complete project dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents rt_estimator.py cli.py enrichment.py simulator.py
      - name: Test Python modules
        run: python -m pytest -q
      - name: Test browser estimator
        run: node --test web/*.test.mjs
